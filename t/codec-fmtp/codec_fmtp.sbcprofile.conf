# Transcode a PCMA-only caller to an iLBC or Opus callee (PCMA is listed, as
# transcoder codecs are only added to SDP already carrying one of them), so
# that SEMS runs codec instances on the callee leg, initialised from the
# callee's answer.
enable_auth=no
next_hop=127.0.0.1:5074
next_hop_fixed=yes
enable_rtprelay=yes
enable_transcoder=always
transcoder_codecs=PCMA,iLBC/8000,opus/48000
